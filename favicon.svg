<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="bg" x1="20" y1="20" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#1e3a8a"/>
      <stop offset="40%" stopColor="#0f172a"/>
      <stop offset="100%" stopColor="#2e0854"/>
    </linearGradient>
    <linearGradient id="border" x1="20" y1="20" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#00f5ff"/>
      <stop offset="45%" stopColor="#38bdf8"/>
      <stop offset="70%" stopColor="#c084fc"/>
      <stop offset="100%" stopColor="#f43f5e"/>
    </linearGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#00f5ff"/>
      <stop offset="100%" stopColor="#ec4899"/>
    </linearGradient>
  </defs>

  <!-- Orbital Ring -->
  <g transform="rotate(-26 100 100)">
    <ellipse cx="100" cy="100" rx="88" ry="48" stroke="url(#orbit)" stroke-width="4" fill="none" stroke-dasharray="160 8 16 8"/>
    <circle cx="20" cy="100" r="4" fill="#00f5ff"/>
    <circle cx="180" cy="100" r="4" fill="#ec4899"/>
  </g>

  <!-- App Badge -->
  <rect x="34" y="34" width="132" height="132" rx="36" fill="url(#bg)" stroke="url(#border)" stroke-width="5"/>

  <!-- Film Strip -->
  <g transform="translate(62, 54)">
    <rect x="0" y="0" width="76" height="86" rx="12" fill="#ffffff"/>
    <rect x="5" y="8" width="8" height="11" rx="2.5" fill="#1e1b4b"/>
    <rect x="5" y="25" width="8" height="11" rx="2.5" fill="#1e1b4b"/>
    <rect x="5" y="42" width="8" height="11" rx="2.5" fill="#1e1b4b"/>
    <rect x="5" y="59" width="8" height="11" rx="2.5" fill="#1e1b4b"/>
    <rect x="63" y="8" width="8" height="11" rx="2.5" fill="#1e1b4b"/>
    <rect x="63" y="25" width="8" height="11" rx="2.5" fill="#1e1b4b"/>

    <!-- Waveform -->
    <g fill="#1e1b4b">
      <circle cx="24" cy="42" r="3.2"/>
      <circle cx="30" cy="42" r="2.2"/>
      <rect x="34" y="32" width="3.5" height="20" rx="1.75"/>
      <rect x="39" y="24" width="4" height="36" rx="2"/>
      <rect x="44.5" y="30" width="3.5" height="24" rx="1.75"/>
      <rect x="49.5" y="20" width="4.5" height="44" rx="2.25"/>
      <rect x="55.5" y="28" width="3.5" height="28" rx="1.75"/>
      <rect x="60.5" y="34" width="3.5" height="16" rx="1.75"/>
      <circle cx="67" cy="42" r="2.2"/>
    </g>

    <text x="48" y="76" text-anchor="middle" fill="#1e1b4b" font-size="21" font-weight="900" font-family="system-ui, sans-serif" letter-spacing="-0.5">SRT</text>
  </g>
</svg>
